<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — b-tools</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head><body>
<main id="login" class="center"><form class="plate" id="f">
  <div class="mk">b</div><div class="logo">Admin</div>
  <label>Email</label><input id="e" type="email" autocomplete="username" required>
  <label>Kata sandi</label><input id="p" type="password" autocomplete="current-password" required>
  <button class="btn" style="width:100%;margin-top:18px">Masuk</button><div class="msg" id="m"></div>
</form></main>

<div id="app" class="hide">
 <header class="hd"><div class="lg"><div class="mk">b</div><b>Admin</b></div><div class="ac"><a class="btn alt sm" href="/" style="display:grid;place-items:center">Situs</a><button class="btn alt sm" id="out">Keluar</button></div></header>
 <div class="wrap">
  <h2>Pengumuman <span>&amp; Situs</span></h2>
  <form class="panel" id="sf">
    <label class="ck"><input type="checkbox" id="on">Tampilkan pengumuman (popup, bisa disembunyikan user 5 jam)</label>
    <label>Judul popup</label><input id="at" placeholder="RILIS BARU!!!">
    <label>URL gambar (opsional)</label><input id="ai" type="url" placeholder="https://…/banner.png">
    <label>Teks pengumuman</label><textarea id="ax" rows="3"></textarea>
    <div class="r2"><div><label>Teks tombol</label><input id="ab" placeholder="Join sekarang"></div><div><label>Link tombol</label><input id="al" type="url" placeholder="https://chat.whatsapp.com/…"></div></div>
    <label>Teks berjalan di banner</label><input id="mq" placeholder="Aplikasi gratis pilihan • Update setiap hari">
    <label>Link WhatsApp bantuan &amp; request</label><input id="wa" type="url" placeholder="https://wa.me/62…">
    <button class="btn" style="margin-top:16px">Simpan pengumuman</button><div class="msg" id="sm"></div>
  </form>

  <h2>Info untuk <span>Asisten AI</span></h2>
  <div class="panel"><label>Penjelasan tambahan tentang web (aturan, FAQ, hal yang sering ditanyakan)</label><textarea id="aii" rows="6" maxlength="3000" placeholder="Contoh: Admin online jam 09.00-21.00. Update aplikasi setiap hari."></textarea><button class="btn" id="ais" style="margin-top:14px">Simpan info AI</button><div class="msg" id="aim"></div></div>

  <h2>Member <span>VIP</span></h2>
  <div class="panel">
    <div class="r2"><div><label>Durasi key (hari)</label><input id="kd" type="number" value="30" min="1"></div><div><label>Jumlah key</label><input id="kc" type="number" value="1" min="1" max="50"></div></div>
    <label>Catatan (opsional, mis. nama pembeli)</label><input id="kn" maxlength="80">
    <button class="btn" id="kg" style="margin-top:14px">Buat key VIP</button>
    <textarea id="ko" rows="3" readonly class="hide" style="margin-top:12px"></textarea>
    <label>Tambah VIP langsung lewat email Google user</label>
    <div class="r2"><input id="vae" type="email" placeholder="email@gmail.com"><input id="vad" type="number" value="30" min="1" aria-label="Hari"><button class="btn" id="vab">Tambah VIP</button></div>
    <div class="msg" id="vm"></div>
  </div>
  <div id="vlist"></div>
  <h2>Key <span>Belum Dipakai</span></h2><div id="klist"></div>

  <h2>Kelola <span>Aplikasi</span></h2>
  <form class="panel" id="af">
    <div class="r2"><div><label>Nama</label><input id="n" required></div><div><label>Kategori</label><input id="c" placeholder="Desain, Developer…"></div></div>
    <div class="r2"><div><label>Link download APK</label><input id="u" type="url" placeholder="https://" required></div><div style="flex:0 1 90px"><label>Ikon</label><input id="i" maxlength="4" placeholder="🧰"></div></div>
    <div class="msg" style="margin:6px 0 0">Unggah file APK ke Google Drive, Mediafire, atau GitHub Releases, lalu tempel link-nya di atas. Datanya tersimpan di server dan tampil untuk semua user.</div>
    <label>URL gambar (opsional, menggantikan ikon)</label><input id="im" type="url">
    <div class="r2"><div><label>Key (opsional)</label><input id="k"></div><div><label>Kompatibilitas (opsional)</label><input id="cm" placeholder="NONROOT / ROOT / Semua"></div></div>
    <label>Deskripsi</label><textarea id="d" rows="4"></textarea>
    <div class="r2"><div><label>Cara membuka unduhan</label><select id="lk"><option value="none">Langsung (tanpa iklan)</option><option value="adsense">Iklan AdSense (hitung mundur)</option><option value="link">Link iklan lain (Adsterra, Monetag, shortlink)</option></select></div><div style="flex:0 1 110px"><label>Hitung mundur (detik)</label><input id="ls" type="number" value="10" min="3" max="60"></div></div>
    <label>Link iklan lain (hanya untuk mode "Link iklan lain")</label><input id="lu" type="url" placeholder="https://…">
    <label class="ck"><input type="checkbox" id="vp">Khusus VIP (link &amp; key hanya terbuka untuk member VIP, tanpa iklan)</label>
    <label class="ck"><input type="checkbox" id="h">Beri label HOT</label>
    <div class="r2" style="margin-top:14px"><button class="btn">Simpan</button><button type="button" class="btn alt" id="rs">Batal</button><button type="button" class="btn alt" id="sd">Isi data contoh</button></div>
    <div class="msg" id="am"></div>
  </form>
  <div id="list"></div>
  <h2>Laporan <span>Link Mati</span></h2><div id="rep"></div>
 </div>
</div>

<script type="module">
import {auth,db,signInWithEmailAndPassword,onAuthStateChanged,signOut,collection,doc,getDoc,getDocs,addDoc,setDoc,deleteDoc,query,orderBy,serverTimestamp} from "./firebase.js";
const $=s=>document.querySelector(s),mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let editId=null;
$("#f").onsubmit=async ev=>{ev.preventDefault();const m=$("#m");m.className="msg";m.textContent="Memeriksa…";
 try{await signInWithEmailAndPassword(auth,$("#e").value,$("#p").value)}catch(e){m.className="msg err";m.textContent="Email atau kata sandi salah."}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u){$("#login").classList.remove("hide");$("#app").classList.add("hide");return}
 let ok=false;try{ok=(await getDoc(doc(db,"admins",u.uid))).exists()}catch(e){}
 if(!ok){await signOut(auth);$("#m").className="msg err";$("#m").textContent="Akun ini bukan admin.";return}
 $("#login").classList.add("hide");$("#app").classList.remove("hide");loadS();load();loadR()});
async function loadS(){const s=(await getDoc(doc(db,"settings","main"))).data()||{};
 $("#on").checked=!!s.annOn;$("#at").value=s.annTitle||"";$("#ai").value=s.annImage||"";$("#ax").value=s.annText||"";$("#ab").value=s.annBtn||"";$("#al").value=s.annLink||"";$("#mq").value=s.marquee||"";$("#wa").value=s.wa||""}
$("#sf").onsubmit=async ev=>{ev.preventDefault();const m=$("#sm");
 try{await setDoc(doc(db,"settings","main"),{annOn:$("#on").checked,annTitle:$("#at").value.trim(),annImage:$("#ai").value.trim(),annText:$("#ax").value.trim(),annBtn:$("#ab").value.trim(),annLink:$("#al").value.trim(),marquee:$("#mq").value.trim(),wa:$("#wa").value.trim(),annVer:Date.now()},{merge:true});
  m.className="msg";m.textContent="Tersimpan. Popup akan muncul lagi untuk semua user."}catch(e){m.className="msg err";m.textContent="Gagal: "+(e.code||"cek aturan")}};
async function load(){const s=await getDocs(query(collection(db,"apps"),orderBy("name")));
 $("#list").replaceChildren(...s.docs.map(d=>{const a=d.data(),r=mk("div","item"),e=mk("button","btn alt sm","Edit"),x=mk("button","btn alt sm","Hapus");
  e.onclick=async()=>{editId=d.id;const vl=a.vip?((await getDoc(doc(db,"vipLinks",d.id))).data()||{}):{};$("#n").value=a.name;$("#c").value=a.category||"";$("#u").value=a.vip?(vl.url||""):a.url;$("#i").value=a.icon||"";$("#im").value=a.image||"";$("#k").value=a.vip?(vl.key||""):(a.key||"");$("#cm").value=a.compat||"";$("#d").value=a.desc||"";$("#h").checked=!!a.hot;$("#vp").checked=!!a.vip;$("#lk").value=a.lock||"none";$("#ls").value=a.lockSec||10;$("#lu").value=a.lockUrl||"";$("#af").scrollIntoView({behavior:"smooth"})};
  x.onclick=async()=>{if(confirm("Hapus "+a.name+"?")){await deleteDoc(doc(db,"apps",d.id));load()}};
  r.append(mk("span","",a.icon||"🧰"),mk("span","n",a.name),mk("small","",(a.clicks||0)+" klik"),e,x);return r}))}
async function loadR(){try{const s=await getDocs(query(collection(db,"reports"),orderBy("at","desc")));
 $("#rep").replaceChildren(...(s.empty?[mk("p","msg","Belum ada laporan.")]:s.docs.map(d=>{const a=d.data(),r=mk("div","item"),x=mk("button","btn alt sm","Selesai");
  x.onclick=async()=>{await deleteDoc(doc(db,"reports",d.id));loadR()};r.append(mk("span","","⚠️"),mk("span","n",a.name+" — link mati"),x);return r})))}catch(e){}}
const reset=()=>{editId=null;$("#af").reset()};$("#rs").onclick=reset;
$("#af").onsubmit=async ev=>{ev.preventDefault();const m=$("#am");
 const data={name:$("#n").value.trim(),category:$("#c").value.trim(),url:$("#u").value.trim(),icon:$("#i").value.trim(),image:$("#im").value.trim(),key:$("#k").value.trim(),compat:$("#cm").value.trim(),desc:$("#d").value.trim(),hot:$("#h").checked,vip:$("#vp").checked,lock:$("#lk").value,lockSec:+$("#ls").value||10,lockUrl:$("#lu").value.trim()};
 const vip=data.vip,secret={url:data.url,key:data.key};if(vip){data.url="";data.key=""}
 try{const ref=editId?doc(db,"apps",editId):doc(collection(db,"apps"));
  await(editId?setDoc(ref,data,{merge:true}):setDoc(ref,{...data,clicks:0,at:serverTimestamp()}));
  if(vip)await setDoc(doc(db,"vipLinks",ref.id),secret);else await deleteDoc(doc(db,"vipLinks",ref.id)).catch(()=>{});
  m.className="msg";m.textContent="Tersimpan.";reset();load()}catch(e){m.className="msg err";m.textContent="Gagal: "+(e.code||"cek aturan Firestore")}};
$("#sd").onclick=async()=>{const S=[["Excalidraw","Desain","https://excalidraw.com","✏️","Papan gambar gaya sketsa tangan."],["Photopea","Desain","https://www.photopea.com","🖼️","Editor gambar mirip Photoshop."],["Squoosh","Developer","https://squoosh.app","🗜️","Kompres dan ubah format gambar."],["diagrams.net","Produktivitas","https://app.diagrams.net","🧩","Buat diagram alur dan UML."],["Regex101","Developer","https://regex101.com","🔎","Uji regular expression."],["Carbon","Developer","https://carbon.now.sh","💎","Ubah kode jadi gambar rapi."]];
 for(const s of S)await addDoc(collection(db,"apps"),{name:s[0],category:s[1],url:s[2],icon:s[3],desc:s[4],hot:false,clicks:0,at:serverTimestamp()});load()};
</script>
<script type="module">
import {auth,db,onAuthStateChanged,doc,getDoc,setDoc} from "./firebase.js";
const $=s=>document.querySelector(s);
onAuthStateChanged(auth,async u=>{if(!u)return;try{$("#aii").value=((await getDoc(doc(db,"settings","main"))).data()||{}).aiInfo||""}catch(e){}});
$("#ais").onclick=async()=>{const m=$("#aim");try{await setDoc(doc(db,"settings","main"),{aiInfo:$("#aii").value.trim()},{merge:true});m.className="msg";m.textContent="Tersimpan. AI langsung memakai info terbaru."}catch(e){m.className="msg err";m.textContent="Gagal menyimpan (hanya admin)."}};
</script>
<script type="module">
import {auth,db,onAuthStateChanged,collection,getDocs,query,orderBy,limit} from "./firebase.js";
const $=s=>document.querySelector(s),mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const call=async b=>{const t=await auth.currentUser.getIdToken(),r=await fetch("/api/vip",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify(b)}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Gagal");return j};
const fd=t=>t&&t.toMillis?new Date(t.toMillis()).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}):"-";
const msg=(t,e)=>{const m=$("#vm");m.className="msg"+(e?" err":"");m.textContent=t};
async function lv(){try{const s=await getDocs(query(collection(db,"vips"),orderBy("until","desc"),limit(100)));
 $("#vlist").replaceChildren(...(s.empty?[mk("p","msg","Belum ada member VIP.")]:s.docs.map(d=>{const a=d.data(),on=a.until&&a.until.toMillis()>Date.now(),r=mk("div","item"),p=mk("button","btn alt sm","+30 hari"),x=mk("button","btn alt sm","Cabut");
  p.onclick=async()=>{try{await call({action:"add",uid:d.id,days:30});lv()}catch(e){msg(e.message,1)}};
  x.onclick=async()=>{if(confirm("Cabut VIP "+(a.email||d.id)+"?"))try{await call({action:"revoke",uid:d.id});lv()}catch(e){msg(e.message,1)}};
  r.append(mk("span","n",a.email||a.name||d.id),mk("small","",(on?"aktif sampai ":"habis ")+fd(a.until)),p,x);return r})))}catch(e){}}
async function lk(){try{const s=await getDocs(query(collection(db,"vipKeys"),orderBy("createdAt","desc"),limit(60)));const L=s.docs.filter(d=>!d.data().usedBy);
 $("#klist").replaceChildren(...(L.length?L.map(d=>{const a=d.data(),r=mk("div","item"),c=mk("button","btn alt sm","Salin"),x=mk("button","btn alt sm","Hapus");
  c.onclick=async()=>{try{await navigator.clipboard.writeText(d.id);c.textContent="Tersalin"}catch(e){}};
  x.onclick=async()=>{try{await call({action:"delkey",key:d.id});lk()}catch(e){msg(e.message,1)}};
  r.append(mk("span","n",d.id),mk("small","",a.days+" hari"+(a.note?" · "+a.note:"")),c,x);return r}):[mk("p","msg","Tidak ada key tersisa.")]))}catch(e){}}
onAuthStateChanged(auth,u=>{if(u){lv();lk()}});
$("#kg").onclick=async()=>{try{const j=await call({action:"genkey",days:+$("#kd").value,count:+$("#kc").value,note:$("#kn").value});$("#ko").value=j.keys.join("\n");$("#ko").classList.remove("hide");msg("Key dibuat. Salin lalu berikan ke pembeli.");lk()}catch(e){msg(e.message,1)}};
$("#vab").onclick=async()=>{try{const j=await call({action:"add",email:$("#vae").value,days:+$("#vad").value});msg("VIP aktif sampai "+new Date(j.until).toLocaleDateString("id-ID"));$("#vae").value="";lv()}catch(e){msg(e.message,1)}};
</script>
</body></html>
